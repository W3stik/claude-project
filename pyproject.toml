[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrader"
version = "0.1.0"
description = "Day trading toolkit: technical analysis, scanner, backtests, paper & live trading via Alpaca / CCXT, Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "yfinance>=0.2.54",
    "streamlit>=1.64",
    "plotly>=5.24",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.4"]
ai = ["anthropic>=1,<2"]
all = ["daytrader[crypto,ai]"]
dev = ["daytrader[all]", "pytest>=8"]

[project.scripts]
daytrader = "daytrader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]
