name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  windows-install-bat:
    # Same path a Windows user takes: double-click install.bat, then start.bat.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install.bat
        shell: cmd
        env:
          DAYTRADER_PYTHON: python
        run: install.bat
      - name: python -m daytrader
        shell: cmd
        run: .venv\Scripts\python.exe -m daytrader strategies
      - name: Install pytest
        shell: cmd
        run: .venv\Scripts\python.exe -m pip install pytest
      - name: Test
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest
