name: probe-sources
on:
  push:
    paths:
      - ".github/workflows/probe-sources.yml"
      - "pokemon-packs/scripts/probe-sources.mjs"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pokemon-packs/scripts/probe-sources.mjs
