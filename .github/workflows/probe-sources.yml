name: probe-sources
on:
  push:
    paths:
      - ".github/workflows/probe-sources.yml"
      - "pokemon-packs/scripts/probe-sources.mjs"
      - "pokemon-packs/scripts/fetch-prices.mjs"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.34.4
        working-directory: pokemon-packs
      - run: node scripts/probe-sources.mjs
        working-directory: pokemon-packs
      - run: node scripts/fetch-prices.mjs && head -c 600 public/data/prices.json
        working-directory: pokemon-packs
