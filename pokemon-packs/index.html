<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="Simulátor otevírání balíčků Pokémon TCG se skutečnými sadami, kartami a cenami." />
    <title>Booster Lab</title>
    <link rel="manifest" href="./manifest.webmanifest" />

  <body>

      <a href="#/album" data-route="album"><span class="tabbar__icon">📖</span>Album</a>
      <a href="#/more" data-route="more"><span class="tabbar__icon">⚙️</span>Více</a>
